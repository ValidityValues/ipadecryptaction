name: Resolve App Store app (no Apple ID)

on:
  workflow_dispatch:
    inputs:
      app_store_url:
        description: "App Store URL, for example https://apps.apple.com/.../id123456789"
        required: true
        type: string
      ios_version:
        description: "Target iOS version, for example 16.5.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04

    env:
      APP_STORE_URL: ${{ inputs.app_store_url }}
      TARGET_IOS: ${{ inputs.ios_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve public App Store metadata
        shell: bash
        run: bash scripts/resolve-public.sh

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: app-store-metadata
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
